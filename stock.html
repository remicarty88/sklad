<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Склад</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mute:#6e6e73;--line:#e5e5ea;--acc:#007aff;--accbg:#e5f0ff;--ok:#248a3d;--low:#b25000;--out:#d70015;--okbg:#e3f7e8;--lowbg:#fff0d9;--outbg:#ffe5e5;--dr:#0a84a8;--sn:#8e5bd6}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d10;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989f;--line:#38383a;--acc:#0a84ff;--accbg:#0b2a4d;--ok:#30d158;--low:#ff9f0a;--out:#ff6961;--okbg:#0f3320;--lowbg:#3d2a08;--outbg:#40181a;--dr:#46c3cd;--sn:#ab8df2}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--card);border-radius:14px;padding:10px 16px;min-height:50px;transition:transform .08s}
button:active{transform:scale(.97)}
button.main{background:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.4;pointer-events:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input{width:100%;border:0;background:var(--card);border-radius:14px;padding:12px 16px;min-height:50px}
.dl input,.opts input{background:var(--bg)}
[hidden]{display:none!important}
small,.mute{color:var(--mute)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 0 12px}
header h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 auto 0 0}
.live{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.live:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--mute)}
.live.on:before{background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #30d15888}70%,100%{box-shadow:0 0 0 8px #30d15800}}
header button{min-height:40px;padding:6px 14px;background:var(--card);font-size:15px}
.banner{background:var(--lowbg);color:var(--low);border-radius:14px;padding:12px 16px;margin-bottom:10px;font-size:15px}
#tools{margin-bottom:12px}
#tools input{background:#7676801f}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:40px;padding:4px 16px;border-radius:20px;font-size:15px}
.chips button.on{background:var(--acc);color:#fff}
.chips b{margin-left:6px;opacity:.7}
.list{background:var(--card);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;--c:var(--mute);--bgc:var(--line)}
.row+.row{box-shadow:inset 0 1px 0 var(--line);background-clip:padding-box}
.row.ok{--c:var(--ok);--bgc:var(--okbg)}.row.low{--c:var(--low);--bgc:var(--lowbg)}.row.out{--c:var(--out);--bgc:var(--outbg)}
.row.flash{animation:fl 1.6s}
@keyframes fl{0%,30%{background:var(--accbg)}}
.av{width:46px;height:46px;border-radius:50%;background:var(--bgc);color:var(--c);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.rb{flex:1;min-width:0}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{font-size:14px;color:var(--mute)}.sb i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.row.low .sb,.row.out .sb{color:var(--c);font-weight:500}
.bal{font-size:26px;font-weight:700;line-height:1;text-align:right}.bal small{display:block;font-size:12px;font-weight:400;margin-top:2px}
.panel{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.panel h2{font-size:18px;margin:0 0 8px}
.buy{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.buy:first-of-type{border-top:0}
.panel .acts{margin-top:10px}.panel .acts button{background:var(--bg)}.panel .acts .main{background:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:40px 20px}
.day{font-size:14px;color:var(--mute);margin:18px 4px 6px;font-weight:600}
.je{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.jh,.jl{display:flex;align-items:center;gap:10px}.jl{padding:6px 0 0 48px;justify-content:space-between;font-size:15px}
.jn{flex:1;min-width:0}.jn b{display:block}.tm{color:var(--mute);font-size:14px}
.chip{border-radius:10px;padding:3px 10px;font-weight:700}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.out{background:var(--outbg);color:var(--out)}.chip.cnt{background:var(--line)}
.x{min-height:36px;padding:0 10px;color:var(--out);background:none}
.rs{position:sticky;top:0;z-index:4;background:var(--bg);padding:4px 0 10px}
#rq{font-size:18px;min-height:56px;border-radius:16px;background:var(--card)}
.hit{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin-top:6px;min-height:58px}
.hit span small{display:block}.hit b{font-size:26px;color:var(--acc);font-weight:400}
.fill{width:100%;margin:2px 0 10px;background:var(--accbg);color:var(--acc);font-weight:600}
.ln{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:10px;animation:in .18s}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.lh{display:flex;justify-content:space-between;align-items:center;gap:8px}.lh b{font-size:18px}
.lb{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.stp{display:flex;gap:6px}.stp button{width:50px;padding:0;font-size:24px;background:var(--bg)}.stp input{width:88px;font-size:26px;font-weight:700;text-align:center;padding:0;background:var(--bg)}
.pk{display:flex;gap:6px}.pk button{min-height:50px;padding:0 12px;color:var(--acc);font-weight:600;background:var(--accbg)}
.pv{margin-left:auto;color:var(--mute);text-align:right;font-size:15px}.pv b{font-size:22px;color:var(--ink)}
.seg{display:flex;gap:4px;margin-top:10px;background:var(--bg);border-radius:14px;padding:3px}.seg button{flex:1;min-height:40px;background:none;border-radius:11px}.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.opts input{background:var(--card)}
.rbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px #0000001a;padding:12px 16px;z-index:6}
.rbar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}.rbar .in>div{flex:1}.rbar b{font-size:19px;display:block}
.rbar button{min-width:150px;min-height:54px;font-size:18px}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -1px 0 var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:7;gap:2px;max-width:640px;margin:0 auto}
#nav button{flex:1;background:none;min-height:54px;padding:2px;font-size:11px;font-weight:500;color:var(--mute);border-radius:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
#nav button i{font-style:normal;font-size:23px;line-height:1}
#nav button.on{color:var(--acc)}
#nav button.go{background:var(--acc);color:#fff;flex:1.2}
#nav b{position:absolute;top:0;right:6px;background:var(--out);color:#fff;border-radius:9px;padding:0 6px;font-size:11px}#nav b:empty{display:none}
#nav button.go b{background:#fff;color:var(--acc)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 18px;z-index:20;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px #0005;max-width:94vw}
#toast button{min-height:38px;background:#ffffff26;color:inherit;padding:0 14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border-radius:18px;padding:14px;font-size:13px;color:var(--mute)}.tile b{display:block;font-size:28px;line-height:1.1;color:var(--ink)}.tile.out b{color:var(--out)}
.chart{display:flex;gap:4px;align-items:flex-end}.col{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.stk{display:flex;flex-direction:column-reverse;border-radius:4px;overflow:hidden;min-height:2px}.stk i{display:block}.stk .d,.hbar i.d{background:var(--dr)}.stk .s,.hbar i.s{background:var(--sn)}
.legend{display:flex;gap:16px;margin-top:8px;font-size:14px}.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}.legend .d:before{background:var(--dr)}.legend .s:before{background:var(--sn)}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr 56px;gap:8px;align-items:center;cursor:pointer}.hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}.hb b{text-align:right;font-size:15px}
.hbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}.hbar i{display:block;height:100%;border-radius:5px;background:var(--mute)}.hbar i.ok{background:var(--ok)}.hbar i.low{background:var(--low)}.hbar i.out{background:var(--out)}
label{display:block;margin:14px 0 6px;color:var(--mute);font-size:14px}
dialog{border:0;border-radius:24px;padding:0;width:min(480px,94vw);max-height:92vh;background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
.dl{padding:20px}.dl h3{margin:0;font-size:22px}
.bigbal{display:flex;gap:28px;margin:12px 0}.bigbal b{font-size:34px;display:block;line-height:1.1}
.quick{display:flex;gap:6px;margin-top:8px}.quick button{flex:1;background:var(--accbg);color:var(--acc);font-weight:600}
.acts{display:flex;gap:8px;margin-top:14px}.acts button{flex:1}.dl .acts button:not(.main){background:var(--bg)}
.err{color:var(--out);margin-top:6px}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.hist button{min-height:30px;padding:0 8px;color:var(--out);background:none}
input.big{font-size:30px;font-weight:700;text-align:center}
.lc{background:var(--bg)!important}
@media(max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:24px 24px 0 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#login{max-width:320px;margin:18vh auto;padding:16px;text-align:center}#login h1{font-size:36px}
.big2{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.1}.big2 small{font-size:18px;font-weight:400}
.up{color:var(--ok);font-weight:600}.dn{color:var(--out);font-weight:600}.hero>div{margin-top:4px}
.col.td small{color:var(--ink);font-weight:700}.col.td .stk{outline:2px solid var(--acc);outline-offset:1px}.col small{display:block;height:14px;font-size:11px}
.tp{display:flex;gap:12px;padding:10px 0;cursor:pointer;border-top:1px solid var(--line)}.tp:first-of-type{border-top:0}
.rk{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;margin-top:1px}
.tb{flex:1;min-width:0}.tn{display:flex;justify-content:space-between;gap:8px}.tn b:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrs{gap:2px}.hrs .col{font-size:10px}.more{width:100%;margin-top:8px;background:var(--bg)!important;color:var(--acc)}

/* ── карточки ── */
.wrap{max-width:980px}
.hero2{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,var(--acc),#5e5ce6);color:#fff;border-radius:24px;padding:18px 20px;margin-bottom:14px;box-shadow:0 10px 30px #5e5ce633}
.ring{--p:0;width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff33 0)}
.ring b{width:60px;height:60px;border-radius:50%;background:#2f2f8f;display:grid;place-items:center;font-size:20px}
.hero2 h2{margin:0;font-size:20px}.hero2 p{margin:3px 0 0;opacity:.85;font-size:14px}
.hero2 .pl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.hero2 .pl span{background:#ffffff26;border-radius:10px;padding:2px 10px;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.cd{--c:var(--mute);--bgc:var(--line);position:relative;background:var(--card);border-radius:22px;padding:14px 14px 12px;cursor:pointer;overflow:hidden;box-shadow:0 1px 2px #0000000d,0 6px 18px #0000000a;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px}
.cd:hover{transform:translateY(-3px);box-shadow:0 10px 26px #00000020}
.cd:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.cd.ok{--c:var(--ok);--bgc:var(--okbg)}.cd.low{--c:var(--low);--bgc:var(--lowbg)}.cd.out{--c:var(--out);--bgc:var(--outbg)}
.cd.flash{animation:fl 1.6s}
.cd .t{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-top:2px}
.cd .pill{background:var(--bgc);color:var(--c);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.cd .cn{font-weight:650;font-size:15px;line-height:1.25;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd .big{display:flex;align-items:baseline;gap:5px}.cd .big b{font-size:40px;line-height:1;letter-spacing:-.03em;color:var(--c)}.cd .big small{font-size:13px}
.cd .fl{height:9px;border-radius:6px;background:var(--bgc);overflow:hidden}.cd .fl i{display:block;height:100%;border-radius:6px;background:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.cd .mt{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.cd .sp{display:flex;align-items:flex-end;gap:2px;height:22px}.cd .sp i{flex:1;background:var(--c);opacity:.35;border-radius:2px;min-height:2px}.cd .sp i:last-child{opacity:1}
.cd .ord{background:var(--bgc);color:var(--c);border-radius:12px;padding:5px 10px;font-size:13px;font-weight:700;text-align:center}

/* ── v3: типографика и палитра ── */
:root{--bg:#f3f4f8;--card:#fff;--ink:#0b0d12;--mute:#6b7280;--line:#e7e9f0;--acc:#4f46e5;--accbg:#eceafe;--ok:#0f9d6b;--low:#c26a00;--out:#e11d48;--okbg:#e2f6ee;--lowbg:#fdf0da;--outbg:#fde6ec;--dr:#4f46e5;--sn:#d946ef;--fd:'Inter Tight','Inter',-apple-system,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#07080c;--card:#10121a;--ink:#f3f4f7;--mute:#8b90a0;--line:#1e2230;--acc:#818cf8;--accbg:#1b1d3d;--ok:#34d399;--low:#fbbf24;--out:#fb7185;--okbg:#0c2b21;--lowbg:#33260a;--outbg:#3a1220;--dr:#818cf8;--sn:#e879f9}}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:16px;font-feature-settings:'cv11','ss01','tnum';-webkit-font-smoothing:antialiased;background:radial-gradient(900px 420px at 85% -80px,#4f46e51f,transparent),radial-gradient(700px 360px at -10% 0,#d946ef14,transparent),var(--bg);background-attachment:fixed}
header h1,.panel h2,.hero2 h2,.big2,.cd .cn,.cd .big b,.kpi b,.bal,h3{font-family:var(--fd)}
header h1{font-size:44px;font-weight:800;letter-spacing:-.045em}
.panel{border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:none}
.panel h2{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 14px}
.big2{font-size:72px;font-weight:800;letter-spacing:-.05em}
.cd{border:1px solid var(--line);box-shadow:none;border-radius:24px}.cd:before{height:3px;opacity:.9}
.cd .big b{font-size:46px;font-weight:800;letter-spacing:-.055em}.cd .cn{font-weight:600;letter-spacing:-.015em}
.cd .pill{font-size:10px;letter-spacing:.07em;text-transform:uppercase}
.hero2{background:linear-gradient(120deg,#4338ca,#7c3aed 60%,#c026d3);box-shadow:0 18px 50px #7c3aed40}
.hero2 h2{font-size:26px;font-weight:800;letter-spacing:-.03em}.ring b{background:#3b1a8f;font-family:var(--fd);font-weight:800}
.ax{font-size:10px;fill:var(--mute)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .k,.k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.kpi b{font-size:40px;font-weight:800;letter-spacing:-.05em;line-height:1}.kpi b small{font-size:15px;font-weight:600;color:var(--mute);letter-spacing:0}
.kpi em{font-style:normal;font-size:13px;color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.g2>.panel{margin:0}
.ins{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.45}.ins:first-of-type{border-top:0}.ins i{font-style:normal;font-size:20px}
.ab{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;font:800 12px var(--fd);flex:none}.ab.A{background:var(--okbg);color:var(--ok)}.ab.B{background:var(--lowbg);color:var(--low)}.ab.C{background:var(--line);color:var(--mute)}
.rw{display:grid;grid-template-columns:26px minmax(90px,1.3fr) 2fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}.rw:first-of-type{border-top:0}.rw .hn{font-weight:550}.rw b{font-family:var(--fd);font-size:15px;text-align:right;white-space:nowrap}.rw small{font-size:12px}
.hm{display:grid;grid-template-columns:26px repeat(24,1fr);gap:3px;align-items:center}.hm small{font-size:10px;color:var(--mute);text-align:center}.hm i{aspect-ratio:1;border-radius:4px;background:var(--acc);display:block}
.dy{display:grid;grid-template-columns:minmax(80px,1.2fr) 1.4fr 56px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.dy:first-of-type{border-top:0}.dy b{text-align:right;font-family:var(--fd)}
@media(max-width:700px){.kp{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.big2{font-size:56px}header h1{font-size:36px}}

/* ── v4: деловая тема ── */
:root{--bg:#f4f5f7;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--acc:#1e40af;--accbg:#e8eefc;--ok:#15803d;--low:#b45309;--out:#b91c1c;--okbg:#e6f4ea;--lowbg:#fdf3e1;--outbg:#fbe9e9;--dr:#1e40af;--sn:#64748b}
@media(prefers-color-scheme:dark){:root{--bg:#0c0f16;--card:#131824;--ink:#e8ecf3;--mute:#8b95a7;--line:#232b3b;--acc:#7aa2f7;--accbg:#172344;--ok:#4ade80;--low:#fbbf24;--out:#f87171;--okbg:#10291a;--lowbg:#2d2208;--outbg:#351414;--dr:#7aa2f7;--sn:#94a3b8}}
body{background:var(--bg)}
button,input{border-radius:10px}input{border:1px solid var(--line)}button{border:1px solid var(--line)}button.main{border-color:var(--acc)}
.chips button,.seg button{border-color:transparent}
header h1{font-size:30px;font-weight:800;letter-spacing:-.035em}
.panel,.cd,.kpi,.ordc{border-radius:14px}.list{border-radius:14px}.hero2{border-radius:16px}
.hero2{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hero2 p{opacity:1;color:var(--mute)}.hero2 h2{font-size:22px}
.ring{background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}.ring b{background:var(--card);color:var(--ink)}
.hero2 .pl span{background:var(--bg);color:var(--ink);border-radius:8px}
.cd:before{height:3px}.cd .pill{border-radius:6px}.cd .ord{border-radius:8px}

 #nav{top:0;bottom:0;left:0;right:auto;width:232px;max-width:none;margin:0;flex-direction:column;justify-content:flex-start;gap:2px;padding:84px 12px 16px;border-right:1px solid var(--line);box-shadow:none}
 #nav:before{content:"СКЛАД";position:absolute;top:30px;left:26px;font:800 15px var(--fd);letter-spacing:.16em}

/* ── v7: тихий минимализм ── */
:root{--bg:#f7f7f8;--card:#fff;--ink:#23262b;--mute:#7b8089;--line:#ececef;--acc:#46525f;--accbg:#eff1f3;--dr:#8a9bab;--sn:#b0a4ad;--ok:#6a957f;--okbg:#eef4f0;--low:#a98a52;--lowbg:#f6f1e7;--out:#a96b6b;--outbg:#f6eded;--fd:'Onest',system-ui,sans-serif;--r:16px;--onacc:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141517;--card:#1b1d20;--ink:#e6e8eb;--mute:#8a9097;--line:#26292d;--acc:#b4bfca;--accbg:#24282c;--dr:#8fa6ba;--sn:#b5a8b3;--ok:#8abb9f;--okbg:#1c2923;--low:#cfab72;--lowbg:#2a261d;--out:#cf8f8f;--outbg:#2c2222;--onacc:#141517}}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);font-size:15px;line-height:1.5}
.wrap{max-width:960px}
header{padding-top:calc(26px + env(safe-area-inset-top))}
header h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
header button{border:0;background:none;color:var(--mute)}
.panel,.cd,.ordc,.list,.hero2,.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.panel{padding:22px;margin-bottom:16px}
.cd:hover{transform:none;box-shadow:none;border-color:var(--mute)}.cd:before{display:none}
.kp{gap:8px;margin-bottom:20px}
.kpi{background:none;border:0;border-radius:0;box-shadow:none;padding:6px 4px;border-left:1px solid var(--line);padding-left:16px}.kpi:first-child{border-left:0;padding-left:4px}
.kpi b{font-size:32px;font-weight:600;letter-spacing:-.03em}
.panel h2,.kpi .k,.k,.ot th,.urg,.sc,.cd .pill,.ins i{text-transform:none;letter-spacing:0}
.panel h2{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px}.kpi .k,.k,.ot th{font-size:12.5px;font-weight:500;color:var(--mute)}.urg,.sc,.cd .pill{font-size:11.5px;font-weight:500}
button,input{border-radius:10px;box-shadow:none}
button.main,.chips button.on,.seg button.on,#nav button.go,.btns button.main{background:var(--acc);color:var(--onacc);border-color:var(--acc);box-shadow:none}
.chips button{background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--mute)}.chips button.on{color:var(--onacc)}
.seg{border-radius:12px;border:1px solid var(--line);background:var(--card);max-width:420px}.seg button{border:0;background:none;color:var(--mute)}.seg button.on{color:var(--onacc)}
.ot td,.ot th{border-bottom:1px solid var(--line)}.ot tr:last-child td{border-bottom:0}.ot tr:hover td{background:none}
.ring{background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}
.per{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}.per .pr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.per input[type=date]{width:auto;min-height:40px}
.brief{border-left:3px solid var(--acc)}.brief h2{font-size:16px}.brief p{margin:0 0 10px;line-height:1.65;max-width:78ch}.brief p:last-child{margin:0}
.ot .why{display:block;color:var(--mute);font-size:12px;max-width:44ch;line-height:1.4}
.rbar,#toast{box-shadow:none;border:1px solid var(--line)}
#nav{background:var(--card);overflow-x:auto;scrollbar-width:none;justify-content:flex-start;gap:0}#nav::-webkit-scrollbar{display:none}
#nav button{flex:0 0 auto;min-width:74px;border:0;color:var(--mute);font-size:11.5px}#nav button.on{color:var(--ink);font-weight:600}#nav button.go{min-width:74px;color:var(--onacc)}
.ng{display:none}
@media(min-width:1000px){
 .wrap{padding-left:268px;padding-right:40px}
 #nav{width:220px;padding:76px 10px 16px;overflow:visible;gap:1px;background:var(--bg);border-right:1px solid var(--line)}
 #nav:before{content:"Склад";font:600 17px var(--fd);letter-spacing:-.01em;top:26px;left:24px}
 #nav button{min-width:0;width:100%;min-height:40px;padding:0 12px;font-size:14px;font-weight:500;border-radius:10px}
 #nav button:hover{background:var(--accbg)}#nav button.on{background:var(--accbg);color:var(--ink);box-shadow:none;font-weight:600}
 #nav button.go{order:0;margin:0 0 6px;justify-content:center;background:var(--acc);color:var(--onacc)}
 .ng{display:block;font-size:12px;color:var(--mute);padding:18px 12px 6px}
}

<body>
<div id="login" hidden>
  <h1>Склад</h1>
  <input id="pin" class="big" type="password" inputmode="numeric" placeholder="PIN-код" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <p><button class="main" id="lgo" style="width:100%">Войти</button></p>
</div>

<div class="wrap" id="app" hidden>
  <header><h1>Склад</h1><span class="live" id="live">нет связи</span><button id="cfg">Настройки</button></header>
  <div id="banner"></div>
  <div id="locs" class="chips" style="margin-bottom:12px"></div>
  <div id="tools"><input id="q" type="search" placeholder="Поиск по названию"></div>
  <main id="main"></main>
  <section id="v-rcv" hidden>
    <div class="rs"><input id="rq" type="search" placeholder="Название или код (сканер сработает сам)" autocomplete="off" enterkeyhint="done"><div id="rres"></div></div>
    <div class="opts"><input id="rnote" maxlength="100" placeholder="Поставщик или № накладной"><input id="rat" type="datetime-local" title="Когда пришло (пусто — сейчас)"></div>
    <div id="rlines"></div>
    <div class="rbar"><div class="in"><div><b id="rt"></b><small>Остатки обновятся у всех сразу</small></div><button class="main" id="rok">Принять</button></div></div>
  </section>
</div>
<nav id="nav" hidden>
  <button data-t="rcv" class="go"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>Приход<b></b></button><span class="ng">Склад</span><button data-t="drinks"><i><svg viewBox="0 0 24 24"><path d="M7 3h10l-1.2 6.5V21H8.2V9.5z"/><path d="M8 13h8"/></svg></i>Напитки<b></b></button><button data-t="snacks"><i><svg viewBox="0 0 24 24"><path d="M4.5 8h15l-1.2 12H5.7z"/><path d="M8.5 8V6.5a3.5 3.5 0 017 0V8"/></svg></i>Снеки<b></b></button><span class="ng">Закупки</span><button data-t="pro"><i><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/><path d="M14 4l3 3 4-4"/></svg></i>Аналитик<b></b></button><button data-t="ord"><i><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M7 5.5H5.5V21h13V5.5H17"/><path d="M9 12h6M9 16h4"/></svg></i>Заказы<b></b></button><button data-t="inv"><i><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg></i>Накладные<b></b></button><span class="ng">Отчёты</span><button data-t="sales"><i><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></i>Продажи<b></b></button><button data-t="an"><i><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></i>Аналитика<b></b></button><button data-t="journal"><i><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg></i>Журнал<b></b></button>
</nav>
<dialog id="dlg"><div class="dl" id="dbody"></div></dialog>
<div id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ST = { ok: 'В норме', low: 'Скоро закончится', out: 'Нет в наличии', new: 'Нет прихода' }, WH = { drinks: 'Напитки', snacks: 'Снеки' };
const sum = a => a.reduce((x, y) => x + y, 0), wh = i => i.wh || 'drinks', r2 = x => Math.round(x * 100) / 100;
const LS = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
if (matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.dataset.d = 1;
let data = null, tab = 'drinks', lastWh = 'drinks', filt = 'all', jr = [], need = [], prev = {}, tt, loc = LS.get('loc', ''), AN = null, anD = LS.get('anD', 14), anAll = false, anBusy = false;
let R = LS.get('rcv', { lines: [], note: '', at: '' }), LQ = LS.get('lq', {});
const saveR = () => LS.set('rcv', R);

async function api(p, body) {
  const r = await fetch('/api/stock' + p, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error('Нужен вход'); }
  if (!r.ok) throw new Error(j.error || 'Ошибка ' + r.status);
  return j;
}
function toast(msg, undo) {
  const t = $('toast'); clearTimeout(tt); t.hidden = false; t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button>Отменить</button>' : '');
  if (undo) t.querySelector('button').onclick = () => { t.hidden = true; undo(); };
  tt = setTimeout(() => t.hidden = true, undo ? 9000 : 3500);
}
function showLogin() { $('app').hidden = true; $('nav').hidden = true; $('login').hidden = false; $('pin').focus(); }
$('lgo').onclick = async () => {
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('pin').value, remember: true }) });
  const j = await r.json().catch(() => ({}));
  if (r.ok) { $('login').hidden = true; load(); live(); } else $('lerr').textContent = j.retry ? 'Слишком много попыток. Повторите через ' + j.retry + ' с' : (j.error || 'Ошибка');
};
$('pin').onkeydown = e => { if (e.key === 'Enter') $('lgo').click(); };

// ── мгновенная синхронизация: сервер сам сообщает об изменениях (приход с другого телефона, новая продажа в iiko) ──
let es, lastVer = null, deb;
const dot = on => { $('live').className = 'live' + (on ? ' on' : ''); $('live').textContent = on ? 'онлайн' : 'нет связи'; };
const soft = () => { clearTimeout(deb); deb = setTimeout(load, 120); };
function live() {
  if (es) es.close(); es = new EventSource('/api/stock/stream');
  es.onopen = () => dot(true);
  es.addEventListener('hello', e => { const v = JSON.parse(e.data).ver; if (lastVer !== null && v !== lastVer) soft(); lastVer = v; });
  es.addEventListener('stock', e => { lastVer = JSON.parse(e.data).ver; soft(); });
  es.onerror = () => { dot(false); fetch('/api/session').then(r => r.json()).then(s => { if (!s.ok) { es.close(); showLogin(); } }).catch(() => {}); };
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && data) load(); });

async function load() {
  try { const q = '?loc=' + encodeURIComponent(loc), [d, j] = await Promise.all([api(q), api('/journal' + q)]); data = d; jr = j.entries; loc = d.loc; LS.set('loc', loc); }
  catch (e) { if (e.message !== 'Нужен вход') { $('app').hidden = false; $('banner').innerHTML = '<div class="banner">' + esc(e.message) + '</div>'; } return; }
  $('app').hidden = false; $('nav').hidden = false; render(); if (tab === 'an' || tab === 'pro') loadAn(); if (tab === 'inv') loadInv(); if (tab === 'sales') loadSales();
}
function go(t) { tab = t; filt = 'all'; $('q').value = ''; if (t in WH) lastWh = t; window.scrollTo(0, 0); render(); if (t === 'an' || t === 'pro') loadAn(); if (t === 'inv') loadInv(); if (t === 'sales') loadSales(); if (t === 'rcv') { if (data.locs.length && !loc) setLoc(LS.get('rloc', '') || data.locs[0].id); $('rq').focus(); } }
function setLoc(id) { loc = id; LS.set('loc', id); if (id) LS.set('rloc', id); load(); }
$('locs').onclick = e => { const b = e.target.closest('button'); if (b) setLoc(b.dataset.l); };
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.t); };
$('q').oninput = () => render();

function render() {
  if ((tab === 'ord' || tab === 'pro') && document.activeElement && document.activeElement.classList.contains('oq')) return;
  $('app').querySelector('h1').textContent = TTL[tab] || 'Склад';
  const b = []; if (data.salesErr) b.push('Продажи из iiko не загрузились, остатки показаны без учёта продаж. ' + data.salesErr); if (data.note) b.push(data.note);
  $('banner').innerHTML = b.map(x => '<div class="banner">' + esc(x) + '</div>').join('');
  const tr = data.items.filter(i => i.tracked && i.here !== false), rc = tab === 'rcv', LC = data.locs || [];
  $('locs').hidden = !LC.length;
  $('locs').innerHTML = (rc ? '<small style="align-self:center">Принять в:</small>' : `<button data-l="" class="${!loc ? 'on' : ''}">Все точки</button>`) + LC.map(l => `<button data-l="${esc(l.id)}" class="${loc === l.id ? 'on' : ''}">${esc(l.name)}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(x => {
    x.classList.toggle('on', x.dataset.t === tab && !x.classList.contains('go'));
    const n = x.querySelector('b'); if (!n) return;
    if (x.dataset.t in WH) n.textContent = tr.filter(i => wh(i) === x.dataset.t && (i.status === 'low' || i.status === 'out')).length || '';
    if (x.dataset.t === 'ord') n.textContent = ordRec().filter(r => !r.covered && r.d === 0).length || '';
    if (x.dataset.t === 'rcv') n.textContent = R.lines.length || '';
  });
  const cur = document.querySelector('#nav button.on'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
  $('v-rcv').hidden = !rc; $('main').hidden = rc; $('tools').hidden = rc || tab === 'an' || tab === 'pro' || tab === 'inv' || tab === 'buy' || tab === 'ord';
  if (rc) { $('rnote').value = R.note; $('rat').value = R.at; if (!$('rlines').dataset.k || document.activeElement !== document.querySelector('#rlines .q')) rcvLines(); }
  else {
    $('main').innerHTML = ({ drinks: () => vWh('drinks'), snacks: () => vWh('snacks'), journal: vJr, an: vAn, pro: vPro, inv: vInv, buy: vBuy, ord: vOrd, sales: vSales })[tab]();
    $('main').querySelectorAll('[data-n]').forEach(r => r.onclick = () => openItem(r.dataset.n));
    $('main').querySelectorAll('[data-f]').forEach(r => r.onclick = () => { filt = r.dataset.f === filt ? 'all' : r.dataset.f; render(); });
    $('main').querySelectorAll('[data-ad]').forEach(r => r.onclick = () => { anD = +r.dataset.ad; LS.set('anD', anD); render(); loadAn(); });
    $('main').querySelectorAll('[data-all]').forEach(r => r.onclick = () => { anAll = !anAll; render(); });
    $('main').querySelectorAll('[data-bsend]').forEach(r => r.onclick = async () => { r.disabled = true; try { await api('/purchase/send', { loc }); toast('Список отправлен в Telegram'); } catch (e) { toast(e.message); } r.disabled = false; });
    $('main').querySelectorAll('[data-bcopy]').forEach(r => r.onclick = () => { const P = buyPlan(); navigator.clipboard.writeText(BS.filter(s => P[s[0]].length).map(([k, , h]) => h + ':\n' + P[k].map(i => '• ' + i.name + ' — ' + i.order).join('\n')).join('\n\n')); toast('Список скопирован'); });
    $('main').querySelectorAll('[data-bfill]').forEach(r => r.onclick = () => { const P = buyPlan(); [...P.now, ...P.soon, ...P.week].forEach(i => { if (!R.lines.some(l => l.num === i.num)) R.lines.push(mkLine(i.num, i.order)); }); saveR(); go('rcv'); });
    $('main').querySelectorAll('[data-undo]').forEach(r => r.onclick = () => { if (confirm('Отменить всю поставку? Остатки пересчитаются.')) undo(r.dataset.undo.split(',')); });
    $('main').querySelectorAll('[data-del]').forEach(r => r.onclick = async () => { if (confirm('Удалить эту запись? Остаток пересчитается.')) { await api('/delete', { id: r.dataset.del }); } });
    $('main').querySelectorAll('.oc').forEach(x => x.onchange = () => { (OD[x.dataset.n] = OD[x.dataset.n] || {}).on = x.checked; render(); });
    $('main').querySelectorAll('.oq').forEach(x => { x.oninput = () => { (OD[x.dataset.n] = OD[x.dataset.n] || {}).q = +x.value; }; x.onchange = () => { document.activeElement.blur(); render(); }; });
    $('main').querySelectorAll('[data-mk]').forEach(b => b.onclick = () => mkOrder(b.dataset.mk));

  $('dbody').innerHTML = `<h3>Настройки</h3><button id="locsb" style="width:100%;margin-top:10px">Точки продаж и кассы…</button><label>Заказывать за сколько дней до конца запаса (так же считается «скоро закончится»)</label><input id="ld" type="number" min="0" value="${s.leadDays}">
    <label>Рекомендуемый закуп считать на (дней продаж)</label><input id="td" type="number" min="1" value="${s.targetDays}">
    <label>Присылать список закупа в Telegram каждый день в (час 0–23, пусто — выключено)</label><input id="bh" type="number" min="0" max="23" value="${s.buyHour >= 0 ? s.buyHour : ''}">
    <div class="acts"><button class="main" id="ssave">Сохранить</button><button id="close">Закрыть</button></div>`;
  $('close').onclick = () => $('dlg').close(); $('locsb').onclick = openLocs;
  $('ssave').onclick = async () => { await api('/settings', { leadDays: $('ld').value, targetDays: $('td').value, buyHour: $('bh').value }); $('dlg').close(); load(); };
  $('dlg').showModal();
};

async function openLocs() {
  let src = { depts: [], regs: [] }, L = JSON.parse(JSON.stringify(data.locs || []));
  $('dbody').innerHTML = '<h3>Точки продаж</h3><div class="empty">Загружаю заведения и кассы из iiko…</div>';
  try { src = await api('/sources'); } catch (e) {}
  const chips = (l, k, all) => [...new Set([...all, ...l[k]])].map(x => `<button data-k="${k}" data-v="${esc(x)}" class="${l[k].includes(x) ? 'on' : ''}">${esc(x)}</button>`).join('') || '<small>iiko не отдал список</small>';
  const draw = () => {
    $('dbody').innerHTML = '<h3>Точки продаж</h3><small>Каждая точка ведёт свой остаток. Приход вносится в точку, а продажи списываются только по выбранным заведениям и кассам. Ничего не выбрано — списываются все продажи.</small>' +
      L.map((l, n) => `<div class="panel lc" data-i="${n}" style="margin-top:10px"><input class="nm2" value="${esc(l.name)}" placeholder="Название, например: Бар"><label>Заведения iiko</label><div class="chips">${chips(l, 'depts', src.depts)}</div><label>Кассы</label><div class="chips">${chips(l, 'regs', src.regs)}</div><button class="x" data-rm="1">Удалить точку</button></div>`).join('') +
      '<div class="acts"><button id="la">+ Добавить точку</button></div><div class="err" id="err"></div><div class="acts"><button class="main" id="ls">Сохранить</button><button id="close">Закрыть</button></div>';
    $('dbody').querySelectorAll('.lc').forEach(p => {
      const l = L[+p.dataset.i]; p.querySelector('.nm2').oninput = e => { l.name = e.target.value; };
      p.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const a = l[b.dataset.k], v = b.dataset.v, x = a.indexOf(v); x < 0 ? a.push(v) : a.splice(x, 1); b.classList.toggle('on'); });
      p.querySelector('[data-rm]').onclick = () => { if (confirm('Удалить точку? Её приходы пропадут из её остатка, в «Все точки» останутся.')) { L.splice(+p.dataset.i, 1); draw(); } };
    });
    $('la').onclick = () => { L.push({ id: '', name: '', depts: [], regs: [] }); draw(); };
    $('close').onclick = () => $('dlg').close();
    $('ls').onclick = async () => { try { await api('/locs', { locs: L }); $('dlg').close(); load(); } catch (e) { $('err').textContent = e.message; } };
  };
  draw();
}

(async () => {
  const s = await fetch('/api/session').then(r => r.json()).catch(() => ({}));
  if (s.ok) { load(); live(); } else showLogin();
})();
setInterval(() => { if (data && !document.hidden) load(); }, 30000);   // страховка, если поток оборвался
</script>
</body>
</html>
